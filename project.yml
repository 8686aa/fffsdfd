name: StarRadar
options:
  bundleIdPrefix: com.starradar
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "15.0"

packages:
  StarRadarCore:
    path: Core

targets:
  StarRadar:
    type: application
    platform: iOS
    sources:
      - path: App/Sources/StarRadar
    dependencies:
      - package: StarRadarCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.starradar.ios
        PRODUCT_NAME: StarRadar
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: App/Info.plist
        # 无签名构建：CI 上没有证书，全部关掉才能出 .app
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"
        SWIFT_OPTIMIZATION_LEVEL: "-O"

schemes:
  StarRadar:
    build:
      targets:
        StarRadar: all
    run:
      config: Debug
    archive:
      config: Release
